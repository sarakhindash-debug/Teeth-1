  <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>كيف نجلس عند طبيب الأسنان؟</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root { color-scheme: light; box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body { margin: 0; }
  body {
    font-family: 'Tahoma', 'Segoe UI', 'Arial', sans-serif;
    background: linear-gradient(135deg, #fef6e4 0%, #e8f4fd 100%);
    background-color: #fef6e4;
    display: flex; flex-direction: column; align-items: center;
    padding: 16px 14px 20px;
    min-height: 100%;
    color: #3a3a5c;
    overflow-x: hidden;
  }
  .header { text-align: center; margin-bottom: 4px; flex-shrink: 0; }
  .title { font-size: 20px; font-weight: 800; color: #3a3a5c; margin: 4px 0; }
  .subtitle { font-size: 13px; color: #888; font-weight: 600; }

  .levels-screen { display: flex; flex-direction: column; align-items: center; width: 100%; max-width: 500px; gap: 16px; margin-top: 8px; }
  .levels-screen.hidden { display: none; }
  .level-card { display: flex; align-items: center; gap: 16px; width: 100%; background: #fff; border-radius: 18px; padding: 14px 18px; box-shadow: 0 5px 16px rgba(0,0,0,0.1); cursor: pointer; border: 3px solid transparent; transition: transform .15s ease; font: inherit; color: inherit; text-align: right; }
  .level-card:active { transform: scale(0.97); }
  .level-card:focus-visible { outline: 3px solid #6c5ce7; outline-offset: 2px; }
  .level-card .icon { font-size: 36px; }
  .level-card .info { flex: 1; }
  .level-card .lvl-title { font-size: 17px; font-weight: 800; color: #3a3a5c; }
  .level-card .lvl-sub { font-size: 13px; color: #888; margin-top: 3px; }
  .level-card .stars-mini { font-size: 15px; color: #ffca3a; min-width: 46px; text-align: left; }

  .sound-toggle { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; background: #fff; border: none; border-radius: 50%; width: 40px; height: 40px; font-size: 18px; box-shadow: 0 3px 10px rgba(0,0,0,0.15); cursor: pointer; z-index: 10; }
  .sound-toggle:active { transform: scale(0.92); }

  .prompt-row { display: none; align-items: center; gap: 10px; margin: 4px 0 6px; width: 100%; max-width: 468px; flex-shrink: 0; }
  .prompt-row.show { display: flex; }
  .prompt-box { background: #fff; border-radius: 16px; padding: 10px 18px; flex: 1; box-shadow: 0 4px 14px rgba(0,0,0,0.08); font-size: 17px; font-weight: 700; color: #5b4b8a; text-align: center; line-height: 1.7; }
  .prompt-box .q-label { display: block; font-size: 14px; color: #8a7fb5; }
  .speak-btn { background: #6c5ce7; border: none; border-radius: 50%; width: 42px; height: 42px; font-size: 18px; color: white; cursor: pointer; box-shadow: 0 3px 10px rgba(108,92,231,0.35); flex-shrink: 0; }
  .speak-btn:active { transform: scale(0.92); }
  .speak-btn.speaking { animation: pulse 0.6s infinite alternate; }
  @keyframes pulse { from { box-shadow: 0 0 0 0 rgba(108,92,231,0.5);} to { box-shadow: 0 0 0 8px rgba(108,92,231,0);} }

  .back-row { width: 100%; max-width: 500px; display: none; flex-shrink: 0; }
  .back-row.show { display: flex; }
  .back-btn { background: none; border: none; color: #6c5ce7; font-size: 13px; font-weight: 700; cursor: pointer; padding: 4px 2px; font-family: inherit; }

  .progress { gap: 8px; margin: 4px 0 8px; display: none; flex-shrink: 0; }
  .progress.show { display: flex; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #e0dcf2; transition: all .25s ease; }
  .dot.done { background: #4caf50; transform: scale(1.15); }
  .dot.current { background: #6c5ce7; transform: scale(1.3); box-shadow: 0 0 0 3px #d9d3f8; }

  .game-area { display: none; flex-direction: column; align-items: center; width: 100%; }
  .game-area.show { display: flex; }

  /* بطاقات الصور: نفس مقاسات النشاط المرجعي (عرض 500px ناقص الهوامش، نسبة 3:2، وفي المستوى الثاني 16:9) */
  .cards { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 468px; }
  .cards.n3 { gap: 8px; }
  .cards.n3 .card img { aspect-ratio: 16 / 9; }
  body.lvl-2 .prompt-box { padding: 8px 14px; }
  body.lvl-2 .prompt-row { margin-bottom: 4px; }
  .card { position: relative; width: 100%; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 6px 18px rgba(0,0,0,0.12); cursor: pointer; border: 5px solid transparent; transition: transform .15s ease, border-color .2s ease; flex-shrink: 0; padding: 0; }
  .card:active { transform: scale(0.98); }
  .card:focus-visible { outline: 3px solid #6c5ce7; outline-offset: 2px; }
  .card img { width: 100%; aspect-ratio: 3 / 2; object-fit: cover; background: #f0eef8; display: block; image-rendering: auto; -webkit-user-drag: none; user-select: none; }
  .badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: clamp(56px, 16vw, 110px); opacity: 0; transform: scale(0.4); transition: all .25s ease; pointer-events: none; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.35)); }
  .badge.show { opacity: 1; transform: scale(1); }
  .card.correct { border-color: #4caf50; }
  .card.wrong-flash { border-color: #ff7675; }
  .card.locked { cursor: default; }
  .card.shake { animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 20% { transform: translateX(-8px);} 40% { transform: translateX(8px);} 60% { transform: translateX(-6px);} 80% { transform: translateX(6px);} }

  .feedback { min-height: 26px; margin-top: 10px; font-size: 16px; font-weight: 700; text-align: center; color: #3a3a5c; }

  .summary { display: none; flex-direction: column; align-items: center; text-align: center; background: #fff; border-radius: 22px; padding: 26px 22px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); max-width: 420px; width: 100%; margin-top: 16px; }
  .summary.show { display: flex; }
  .summary h2 { font-size: 22px; color: #3a3a5c; margin: 6px 0; }
  .summary .score { font-size: 34px; font-weight: 900; color: #6c5ce7; margin: 8px 0; }
  .summary .stars { font-size: 30px; margin: 6px 0 12px; letter-spacing: 4px; }
  .btn-row { display: flex; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  .restart-btn, .levels-btn { padding: 11px 24px; font-size: 14px; font-weight: 700; border: none; border-radius: 28px; color: white; cursor: pointer; box-shadow: 0 5px 14px rgba(0,0,0,0.2); font-family: inherit; }
  .restart-btn { background: #4caf50; }
  .levels-btn { background: #6c5ce7; }
  #summaryMsg { font-size: 14px; color: #666; margin-bottom: 8px; }
  @media (prefers-reduced-motion: reduce) { .card.shake, .speak-btn.speaking { animation: none; } }
</style>
</head>
<body>

<button class="sound-toggle" id="soundToggle" aria-label="تشغيل أو إيقاف الصوت">🔊</button>

<div class="header">
  <div class="title">🌟 أين السلوك الصحيح؟ 🌟</div>
  <div class="subtitle">الجلوس عند طبيب الأسنان</div>
</div>

<div class="levels-screen" id="levelsScreen">
  <button class="level-card" data-level="1">
    <div class="icon">🦷</div>
    <div class="info"><div class="lvl-title">المستوى الأول</div><div class="lvl-sub">اختر بين صورتين</div></div>
    <div class="stars-mini" id="starsL1"></div>
  </button>
  <button class="level-card" data-level="2">
    <div class="icon">🎯</div>
    <div class="info"><div class="lvl-title">المستوى الثاني</div><div class="lvl-sub">اختر بين ثلاث صور</div></div>
    <div class="stars-mini" id="starsL2"></div>
  </button>
</div>

<div class="back-row" id="backRow"><button class="back-btn" id="backBtn">➡️ العودة للمستويات</button></div>

<div class="prompt-row" id="promptRow">
  <button class="speak-btn" id="speakBtn" aria-label="إعادة السؤال">🔈</button>
  <div class="prompt-box"><span class="q-label">السُّؤالُ:</span>كَيْفَ نَجْلِسُ عِنْدَ طَبِيبِ الأَسْنَانِ؟</div>
</div>

<div class="progress" id="progress"></div>

<div class="game-area" id="gameArea">
  <div class="cards" id="cards"></div>
  <div class="feedback" id="feedback"></div>
</div>

<div class="summary" id="summary">
  <h2>أحسنت! 🎉</h2>
  <div class="score" id="scoreText"></div>
  <div class="stars" id="starsText"></div>
  <div id="summaryMsg"></div>
  <div class="btn-row">
    <button class="restart-btn" id="restartBtn">🔁 إعادة المستوى</button>
    <button class="levels-btn" id="levelsBtn">📋 المستويات</button>
  </div>
</div>

let ctx = null, gainNode = null, buffers = {}, current = null, soundOn = true, htmlAudio = {};
function b64ToBuf(dataUri){ const b = atob(dataUri.split(',')[1]); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; }
async function initAudio(){
  if (ctx) { if (ctx.state === 'suspended') { try { await ctx.resume(); } catch(e){} } return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    try {
      ctx = new AC();
      gainNode = ctx.createGain(); gainNode.gain.value = GAIN; gainNode.connect(ctx.destination);
      const s = ctx.createBufferSource(); s.buffer = ctx.createBuffer(1,1,22050); s.connect(ctx.destination); s.start(0);
      await Promise.all(Object.keys(SND).map(k => new Promise(res => {
        ctx.decodeAudioData(b64ToBuf(SND[k]), b => { buffers[k]=b; res(); }, () => res());
      })));
      if (ctx.state === 'suspended') { try { await ctx.resume(); } catch(e){} }
    } catch(e) { ctx = null; }
  }
  Object.keys(SND).forEach(k => { const a = new Audio(SND[k]); a.preload = 'auto'; a.volume = 1; htmlAudio[k] = a; });
}
function stopSound(){
  if (current) { const c = current; current = null; c.onend = null; try { c.stop(); } catch(e){} }
  document.getElementById('speakBtn').classList.remove('speaking');
}
function playSound(name, onEnd){
  stopSound();
  if (!soundOn) { if (onEnd) setTimeout(onEnd, 300); return; }
  let done = false; const finish = () => { if (done) return; done = true; if (current && current.name === name) current = null; if (name==='question') document.getElementById('speakBtn').classList.remove('speaking'); if (onEnd) onEnd(); };
  if (name==='question') document.getElementById('speakBtn').classList.add('speaking');
  if (ctx && buffers[name]) {
    const src = ctx.createBufferSource(); src.buffer = buffers[name]; src.connect(gainNode);
    const handle = { name, stop: () => src.stop(), onend: finish };
    src.onended = () => { if (handle.onend) handle.onend(); };
    current = handle; src.start(0);
  } else if (htmlAudio[name]) {
    const a = htmlAudio[name]; a.currentTime = 0; a.volume = 1;
    const handle = { name, stop: () => { a.pause(); a.currentTime = 0; }, onend: finish };
    a.onended = () => { if (handle.onend) handle.onend(); };
    current = handle; a.play().catch(() => finish());
  } else if (onEnd) setTimeout(onEnd, 300);
}

/* ===== منطق النشاط ===== */
const $ = id => document.getElementById(id);
let level = 1, trial = 0, firstTry = 0, missedThisTrial = false, locked = false, lastOrder = '', timers = [];
const stars = { 1: '', 2: '' };
try { const s = JSON.parse(localStorage.getItem('dentistSeatStars') || '{}'); stars[1] = s[1]||''; stars[2] = s[2]||''; } catch(e){}
function paintStars(){ $('starsL1').textContent = stars[1]; $('starsL2').textContent = stars[2]; }
paintStars();
function later(fn, ms){ const t = setTimeout(fn, ms); timers.push(t); return t; }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function show(screen){
  $('levelsScreen').classList.toggle('hidden', screen !== 'levels');
  ['backRow','promptRow','progress'].forEach(id => $(id).classList.toggle('show', screen === 'game'));
  $('gameArea').classList.toggle('show', screen === 'game');
  $('summary').classList.toggle('show', screen === 'summary');
  $('backRow').classList.toggle('show', screen === 'game' || screen === 'summary');
}
function renderProgress(){
  const p = $('progress'); p.innerHTML = '';
  for (let i=0;i<TRIALS;i++){ const d = document.createElement('div'); d.className = 'dot' + (i<trial?' done':'') + (i===trial?' current':''); p.appendChild(d); }
}
async function startLevel(l){
  await initAudio();
  clearTimers(); stopSound();
  level = l; trial = 0; firstTry = 0;
  document.body.classList.toggle('lvl-2', l === 2);
  show('game'); nextTrial();
}
function nextTrial(){
  locked = false; missedThisTrial = false;
  renderProgress(); $('feedback').textContent = '';
  let items, order;
  do { items = shuffle(LEVELS[level]); order = items.map(i=>i.key).join(','); } while (order === lastOrder);
  lastOrder = order;
  const box = $('cards'); box.innerHTML = ''; box.className = 'cards n' + items.length;
  items.forEach(it => {
    const c = document.createElement('button'); c.className = 'card'; c.type = 'button';
    c.setAttribute('aria-label', it.ok ? 'صورة' : 'صورة');
    const img = document.createElement('img'); img.src = IMG[it.key]; img.alt = ''; img.draggable = false; img.decoding = 'sync';
    const b = document.createElement('div'); b.className = 'badge';
    c.appendChild(img); c.appendChild(b);
    c.addEventListener('click', () => choose(c, it));
    box.appendChild(c);
  });
  later(() => playSound('question'), QUESTION_DELAY);
}
function choose(card, it){
  if (locked) return;
  const badge = card.querySelector('.badge');
  if (it.ok) {
    locked = true; clearTimers();
    if (!missedThisTrial) firstTry++;
    document.querySelectorAll('.card').forEach(c => { c.classList.add('locked'); c.classList.remove('wrong-flash'); c.querySelector('.badge').classList.remove('show'); });
    card.classList.add('correct'); badge.textContent = '✅'; badge.classList.add('show');
    $('feedback').textContent = 'ممتاز! 🎉';
    playSound('excellent', () => {
      later(() => {
        trial++;
        if (trial >= TRIALS) finishLevel(); else nextTrial();
      }, NEXT_DELAY);
    });
  } else {
    missedThisTrial = true;
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake', 'wrong-flash');
    badge.textContent = '❌'; badge.classList.add('show');
    $('feedback').textContent = 'حاول مرة أخرى 💪';
    playSound('tryAgain');
    clearTimeout(card._t);
    card._t = setTimeout(() => {
      badge.classList.remove('show'); card.classList.remove('wrong-flash', 'shake');
      if (!locked) $('feedback').textContent = '';
    }, WRONG_MARK_MS);
  }
}
function finishLevel(){
  trial = TRIALS; renderProgress();
  const s = firstTry === TRIALS ? '⭐⭐⭐' : firstTry >= 3 ? '⭐⭐' : '⭐';
  stars[level] = s; paintStars();
  try { localStorage.setItem('dentistSeatStars', JSON.stringify(stars)); } catch(e){}
  $('scoreText').textContent = firstTry + ' / ' + TRIALS;
  $('starsText').textContent = s;
  $('summaryMsg').textContent = 'إجابات صحيحة من المحاولة الأولى';
  show('summary');
}
function toLevels(){ clearTimers(); stopSound(); show('levels'); }

document.querySelectorAll('.level-card').forEach(c => c.addEventListener('click', () => startLevel(+c.dataset.level)));
$('backBtn').addEventListener('click', toLevels);
$('levelsBtn').addEventListener('click', toLevels);
$('restartBtn').addEventListener('click', () => startLevel(level));
$('speakBtn').addEventListener('click', async () => { await initAudio(); if (!locked) playSound('question'); });
$('soundToggle').addEventListener('click', () => { soundOn = !soundOn; $('soundToggle').textContent = soundOn ? '🔊' : '🔇'; if (!soundOn) stopSound(); });
// تحميل الصور مسبقًا لتظهر فورًا بوضوح كامل
Object.values(IMG).forEach(src => { const i = new Image(); i.src = src; });
show('levels');
</script>
